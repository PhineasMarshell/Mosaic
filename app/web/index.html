<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mosaic — Market Intelligence Agent</title>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1a1a1a;
    --border: #2a2a2a;
    --border-light: #3a3a3a;
    --text: #e5e5e5;
    --text-dim: #a3a3a3;
    --text-muted: #6b6b6b;
    --accent: #e5e5e5;
    --accent-glow: rgba(229,229,229,.08);
    --green: #a3a3a3;
    --green-bg: rgba(163,163,163,.12);
    --orange: #a3a3a3;
    --orange-bg: rgba(163,163,163,.12);
    --red: #a3a3a3;
    --red-bg: rgba(163,163,163,.12);
    --purple: #a3a3a3;
    --purple-bg: rgba(163,163,163,.12);
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: none;
    --shadow-lg: none;
    --max-width: 680px;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  /* ── Full-height flex layout ─────────── */
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
  }

  /* ── Header ─────────────────────────── */
  .chat-header{
    flex-shrink:0;padding:14px 20px;text-align:center;
    border-bottom:1px solid var(--border);background:var(--surface);
  }
  .logo{font-size:20px;font-weight:700;letter-spacing:-.2px;color:var(--text)}
  .tagline{color:var(--text-muted);margin-top:2px;font-size:10px;letter-spacing:.2px}

  /* ── Messages area ──────────────────── */
  .chat-messages{
    flex:1;overflow-y:auto;overflow-x:hidden;
    padding:16px 24px 8px;scroll-behavior:smooth;
  }
  .chat-messages::-webkit-scrollbar{width:6px}
  .chat-messages::-webkit-scrollbar-track{background:transparent}
  .chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  /* ── Welcome screen ─────────────────── */
  .welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;
           height:100%;text-align:center;padding:40px 20px}
  .welcome-logo{font-size:32px;font-weight:700;letter-spacing:-.3px;color:var(--text)}
  .welcome-tagline{color:var(--text-muted);margin-top:4px;font-size:12px;max-width:300px;line-height:1.4}
  .welcome-prompt{font-size:14px;font-weight:500;color:var(--text-dim);margin-top:28px;margin-bottom:14px}
  .quick{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:480px}
  .quick-btn{padding:7px 12px;border-radius:999px;font-size:11px;cursor:pointer;
             border:1px solid var(--border);background:transparent;color:var(--text-dim);
             transition:all .15s}
  .quick-btn:hover{border-color:var(--text-dim);color:var(--text);background:var(--surface2)}

  /* ── Messages ───────────────────────── */
  .msg-row{display:flex;gap:10px;margin:12px 0;animation:fadeInUp .25s ease-out}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .msg-row.user{flex-direction:row-reverse}

  .msg-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
              font-size:13px;font-weight:600;flex-shrink:0}
  .msg-row.user>.msg-avatar{background:var(--surface2);color:var(--text-dim)}
  .msg-row.ai>.msg-avatar{background:var(--surface2);color:var(--text-muted)}

  .msg-bubble{max-width:78%;display:flex;flex-direction:column;gap:0}
  .msg-row.user>.msg-bubble{align-items:flex-end}
  .msg-row.ai>.msg-bubble{align-items:flex-start}

  .user-question{background:var(--surface2);border:1px solid var(--border);
                 border-radius:var(--radius);padding:10px 16px;font-size:14px;color:var(--text);
                 line-height:1.5;display:inline-block}

  .result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
               padding:20px;margin-top:8px;width:100%;animation:fadeInUp .25s ease-out}

  /* ── Loading indicator ──────────────── */
  .loading-indicator{display:flex;align-items:center;gap:10px;margin:12px 0;animation:fadeInUp .2s ease-out}
  .msg-row.loading-indicator-msg{flex-direction:row}
  .loading-spinner{width:18px;height:18px;border:2px solid var(--border);
                   border-top-color:var(--text-dim);border-radius:50%;animation:spin .6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{color:var(--text-muted);font-size:12px}
  .research-steps{text-align:left;display:inline-block;margin-top:4px;max-width:240px}
  .research-step{padding:2px 0;font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:5px}
  .research-step.done .icon{color:var(--text-dim)}
  .research-step.active .icon{color:var(--text)}
  .analyst-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .analyst-card{padding:4px 10px;border-radius:6px;font-size:11px;
                border:1px solid var(--border);color:var(--text-muted);
                background:var(--surface2);transition:all .2s}
  .analyst-card.running{border-color:var(--accent);color:var(--text);
                       background:var(--surface);animation:pulse 1.2s ease-in-out infinite}
  .analyst-card.done{border-color:var(--text-dim);color:var(--text-dim)}
  .analyst-card.done::before{content:'✓ '}
  #summaryCard{margin-top:6px;font-size:11px;color:var(--text-muted);
               padding:4px 10px;border-radius:6px;background:var(--surface2);
               border:1px solid var(--border)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

  /* ── Error ──────────────────────────── */
  .error-msg{background:var(--surface2);border:1px solid var(--border);
             border-radius:var(--radius-sm);padding:12px 16px;color:var(--text-dim);
             margin:8px 0;font-size:13px;animation:fadeInUp .3s ease-out}

  /* ── Input bar ──────────────────────── */
  .chat-input-bar{
    flex-shrink:0;padding:12px 24px 16px;background:var(--surface);
    border-top:1px solid var(--border);
    max-width:var(--max-width);width:100%;margin:0 auto;
    display:flex;flex-direction:column;gap:8px;
  }
  .input-row{display:flex;gap:8px;align-items:flex-end}
  .input-field{flex:1;min-height:40px;max-height:120px;border:1px solid var(--border);border-radius:var(--radius-sm);
               padding:10px 14px;font-size:14px;background:var(--surface2);color:var(--text);
               resize:none;outline:none;font-family:inherit;line-height:1.5;transition:border-color .2s,box-shadow .2s;
               overflow:hidden;scrollbar-width:none}
  .input-field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .input-field::placeholder{color:var(--text-muted)}
  .send-btn{width:36px;height:36px;border:none;border-radius:var(--radius-sm);
            background:var(--surface2);color:var(--text);cursor:pointer;
            display:flex;align-items:center;justify-content:center;flex-shrink:0;
            transition:all .15s;font-size:14px;border:1px solid var(--border)}
  .send-btn:hover:not(:disabled){background:var(--border);color:var(--text)}
  .send-btn:active:not(:disabled){transform:scale(.95)}
  .send-btn:disabled{opacity:.4;cursor:not-allowed}
  .hint{font-size:11px;color:var(--text-muted);text-align:center;padding-top:2px}

  /* ── Footer ─────────────────────────── */
  .chat-footer{text-align:center;color:var(--text-muted);font-size:11px;padding:6px;flex-shrink:0}

  /* ── Result card internal styles ────── */
  .result-header{margin-bottom:12px}
  .result-title{font-size:12px;color:var(--text-muted);margin-bottom:6px}
  .state-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .state-badge{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;
               border-radius:999px;font-size:11px;font-weight:500;
               background:var(--surface2);border:1px solid var(--border);color:var(--text-dim)}
  .state-badge.risk-off{border-color:var(--red);color:var(--red)}
  .state-badge.risk-on{border-color:var(--green);color:var(--green)}
  .state-badge.neutral{border-color:var(--orange);color:var(--orange)}
  .state-badge.mixed{border-color:var(--purple);color:var(--purple)}
  .state-badge.unknown{border-color:var(--border);color:var(--text-muted)}
  .conf-section{margin:4px 0 12px}
  .conf-row{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--text-muted)}
  .conf-bar{flex:1;height:2px;border-radius:1px;background:var(--border);overflow:hidden}
  .conf-fill{height:100%;border-radius:1px;transition:width .5s ease}
  .conf-label{font-weight:500;text-transform:uppercase}
  .section{margin:12px 0}
  .section h2{font-size:13px;font-weight:500;margin-bottom:6px;display:flex;align-items:center;gap:5px}
  .section-body{font-size:13px;color:var(--text-dim);line-height:1.6}
  .section ul{padding-left:16px;margin:4px 0}
  .section li{margin:3px 0}
  .anomaly-grid{display:grid;gap:8px;margin-top:8px}
  .anomaly-card{background:var(--surface2);border:1px solid var(--border);
                border-radius:var(--radius-sm);padding:12px 14px;font-size:12px}
  .anomaly-header{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .anomaly-type{font-weight:500;color:var(--text-dim)}
  .anomaly-severity{font-size:10px;padding:2px 6px;border-radius:999px;font-weight:500;
                    background:var(--surface);border:1px solid var(--border);color:var(--text-muted)}
  .anomaly-severity.high{border-color:var(--red);color:var(--red)}
  .anomaly-severity.medium{border-color:var(--orange);color:var(--orange)}
  .anomaly-severity.low{border-color:var(--green);color:var(--green)}
  .anomaly-detail{color:var(--text-dim);line-height:1.5}
  .anomaly-status{font-size:10px;color:var(--text-muted);margin-top:4px}
  .tool-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .tool-tag{font-size:10px;background:var(--surface);border:1px solid var(--border);
            border-radius:5px;padding:3px 8px;color:var(--text-muted)}

  /* ── Responsive ─────────────────────── */
  @media(max-width:600px){
    .chat-messages{padding:12px 10px 4px}
    .chat-input-bar{padding:8px 10px 12px}
    .msg-bubble{max-width:88%}
    .welcome-logo{font-size:32px}
    .quick-btn{font-size:11px;padding:7px 11px}
    .result-card{padding:16px}
  }
</style>
</head>
<body>

<!-- ═══ Header ═══ -->
<div class="chat-header">
  <div class="logo">MOSAIC</div>
  <div class="tagline">Market Intelligence Agent</div>
</div>

<!-- ═══ Messages ═══ -->
<div class="chat-messages" id="messages">
  <!-- Welcome screen (hidden after first message) -->
  <div class="welcome" id="welcome">
    <div class="welcome-logo">Mosaic</div>
    <div class="welcome-tagline">Make complex markets understandable.</div>
    <div class="welcome-prompt">What is happening?</div>
    <div class="quick">
      <button class="quick-btn" onclick="fill('今天A股发生了什么？')">📊 今日市场状态</button>
      <button class="quick-btn" onclick="fill('今天A股为什么这么弱？')">❓ 归因分析</button>
      <button class="quick-btn" onclick="fill('今天最强的题材是什么？')">🔥 最强题材</button>
      <button class="quick-btn" onclick="fill('今天有什么异常？')">🚨 异常检测</button>
      <button class="quick-btn" onclick="fill('BTC最近上涨健康吗？')">₿ BTC状况</button>
      <button class="quick-btn" onclick="fill('帮我研究贵州茅台')">🔬 个股研究</button>
    </div>
  </div>
</div>

<!-- ═══ Input Bar ═══ -->
<div class="chat-input-bar" id="inputBar">
  <div class="input-row">
    <textarea class="input-field" id="q" placeholder="提问…" rows="1"></textarea>
    <button class="send-btn" id="askBtn" onclick="ask()" title="发送">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <div class="hint" id="hint">Shift+Enter 换行 · Enter 发送</div>
</div>

<!-- ═══ Footer ═══ -->
<div class="chat-footer">Powered by Mosaic × Market Gateway</div>

<script>
// ── State ────────────────────────────────────
let currentConversationId = null;
let lastErrorTimeout = null;
// 服务端一次调查的总预算（秒）。启动时从 /health 读，读不到就用默认值。
// 客户端的放弃时限必须 **大于** 它，否则超时标记会先于真实错误置位，
// 把「上游模型坏了」这类错误一律显示成「请求超时」。
let serverBudgetS = 300;
const CLIENT_TIMEOUT_MARGIN_S = 60;

// ── Helpers ──────────────────────────────────
function fill(v) { document.getElementById('q').value = v; ask(); }

function esc(s) {
  if (s == null) return '';
  const m = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
  return String(s).replace(/[&<>"']/g, c => m[c]);
}

function confColor(c) {
  if (c === 'high') return '#22c55e';
  if (c === 'medium') return '#f59e0b';
  return '#ef4444';
}

function stateBadgeClass(label) {
  if (!label || label === 'Unknown') return 'unknown';
  const l = label.toLowerCase();
  if (/risk-off|danger|risk/i.test(l)) return 'risk-off';
  if (/risk-on|bullish|expansion/i.test(l)) return 'risk-on';
  if (/theme cool|cooling|crowded/i.test(l)) return 'neutral';
  if (/theme rotat|rotation/i.test(l)) return 'mixed';
  if (/leverage|liquidation/i.test(l)) return 'risk-off';
  if (/safe-haven|commodity strength|recovery/i.test(l)) return 'risk-on';
  if (/neutral|mixed/i.test(l)) return 'mixed';
  return 'unknown';
}

function confidencePct(c) {
  if (c === 'high') return 85;
  if (c === 'medium') return 55;
  return 25;
}

// ── Append messages ──────────────────────────
function getMessages() { return document.getElementById('messages'); }

function hideWelcome() {
  const w = document.getElementById('welcome');
  if (w && w.style.display !== 'none') w.style.display = 'none';
}

function scrollToBottom(smooth) {
  const el = getMessages();
  if (smooth !== false) {
    el.scrollTo({top: el.scrollHeight, behavior: 'smooth'});
  } else {
    el.scrollTop = el.scrollHeight;
  }
}

function addUserBubble(text) {
  hideWelcome();
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div class="msg-avatar">你</div><div class="msg-bubble"><div class="user-question">${esc(text)}</div></div>`;
  getMessages().appendChild(row);
  scrollToBottom(false);
}

function addAILoader(message) {
  hideWelcome();
  const analysts = [
    {node: 'technical',   label: '📈 技术面'},
    {node: 'fundamental', label: '🏛 基本面'},
    {node: 'moneyflow',   label: '💰 资金面'},
    {node: 'news',        label: '📰 新闻舆情'},
  ];
  const cards = analysts.map(a =>
    `<div class="analyst-card pending" data-node="${a.node}">${a.label}</div>`
  ).join('');
  const row = document.createElement('div');
  row.className = 'msg-row ai loading-indicator-msg';
  row.id = 'ai-loading';
  row.innerHTML = `<div class="msg-avatar">✦</div><div class="msg-bubble">
    <div class="loading-text">${esc(message)}</div>
    <div class="analyst-row">${cards}</div>
    <div id="summaryCard">等待规划…</div>
  </div>`;
  getMessages().appendChild(row);
  scrollToBottom(false);
}

function updateLoader(index, text) {
  const row = document.getElementById('ai-loading');
  if (!row) return;
  const txt = row.querySelector('.loading-text');
  if (txt) txt.textContent = text;
  const list = document.getElementById('stepList');
  if (!list) return;
  const items = list.querySelectorAll('.research-step');
  items.forEach((el, i) => {
    el.classList.remove('done', 'active');
    if (i < index) { el.classList.add('done'); el.querySelector('.icon').textContent = '✓'; }
    else if (i === index) { el.classList.add('active'); el.querySelector('.icon').textContent = '◉'; }
    else { el.querySelector('.icon').textContent = '○'; }
  });
  scrollToBottom(true);
}

function updateProgress(data) {
  const row = document.getElementById('ai-loading');
  if (!row) return;
  const txt = row.querySelector('.loading-text');
  if (txt && data.message) txt.textContent = data.message;
  const node = data.node;
  if (data.step === 'planning') {
    row.querySelectorAll('.analyst-card').forEach(c => c.className = 'analyst-card running');
  } else if (node && row.querySelector(`.analyst-card[data-node="${node}"]`)) {
    const card = row.querySelector(`.analyst-card[data-node="${node}"]`);
    card.classList.remove('running');
    card.classList.add('done');
  } else if (data.step === 'evaluating' || data.step === 'reasoning' || data.step === 'critic') {
    const sc = document.getElementById('summaryCard');
    if (sc) sc.textContent = data.message;
    row.querySelectorAll('.analyst-card.running').forEach(c => { c.className = 'analyst-card done'; });
  }
  scrollToBottom(true);
}

function removeLoader() {
  const row = document.getElementById('ai-loading');
  if (row) row.remove();
}

function addErrorBubble(message, canRetry) {
  const row = document.createElement('div');
  row.className = 'msg-row ai';
  const retry = canRetry && lastQuestion
    ? `<div style="margin-top:8px"><button class="quick-btn" onclick="retryLastQuestion()">↻ 重试「${esc(lastQuestion.slice(0, 20))}」</button></div>`
    : '';
  row.innerHTML = `<div class="msg-avatar">✦</div><div class="msg-bubble"><div class="error-msg"><strong>调查失败</strong><br>${esc(message)}${retry}</div></div>`;
  getMessages().appendChild(row);
  scrollToBottom(false);
}

function addAIResponse(report) {
  const row = document.createElement('div');
  row.className = 'msg-row ai';
  const c = confColor(report.confidence || 'low');
  const badgeCls = stateBadgeClass(report.state_label);
  const pct = confidencePct(report.confidence);

  const anomalies = (report.anomalies || []).map(a => `
    <div class="anomaly-card"><div class="anomaly-header">
      <span class="anomaly-type">🚨 ${esc(a.description || a.type || 'Anomaly')}</span>
      ${a.severity?`<span class="anomaly-severity ${esc(a.severity)}">${esc(a.severity.toUpperCase())}</span>`:''}
    </div><div class="anomaly-detail">
      ${a.metric?`<div><strong>指标:</strong> ${esc(a.metric)}</div>`:''}
      ${a.value!=null?`<div><strong>当前值:</strong> ${esc(String(a.value))}</div>`:''}
      ${a.normal_range?`<div><strong>正常范围:</strong> ${esc(a.normal_range)}</div>`:''}
      ${a.possible_meaning?`<div><strong>可能含义:</strong> ${esc(a.possible_meaning)}</div>`:''}
    </div><div class="anomaly-status">状态: ${esc(a.status||'Investigating...')}</div></div>`).join('');

  const tools = (report.used_tools || []).map(t => `<span class="tool-tag">${esc(t)}</span>`).join('');
  const strongHtml = report.strong_areas?.length
    ? `<div class="section"><h2>🔥 What's Moving</h2><ul>${report.strong_areas.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>` : '';
  const changedHtml = report.what_changed?.length
    ? `<div class="section"><h2>↔️ What Changed</h2><ul>${report.what_changed.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>` : '';
  const mattersHtml = report.what_matters?.length
    ? `<div class="section"><h2>👁️ What Matters</h2><ul>${report.what_matters.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>` : '';
  const risksHtml = report.risks?.length
    ? `<div class="section"><h2>⚠️ Risks & Contradiction</h2><ul>${report.risks.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>` : '';
  const anomalyHtml = report.anomalies?.length
    ? `<div class="section"><h2>🚨 What's Unusual</h2><div class="anomaly-grid">${anomalies}</div></div>` : '';

  row.innerHTML = `<div class="msg-avatar">✦</div><div class="msg-bubble"><div class="result-card">
    <div class="result-header">
      <div class="result-title">${esc(report.title || '今日市场情报')}</div>
      <div class="state-badges"><div class="state-badge ${badgeCls}">${esc(report.state_label||'N/A')} · ${esc(report.market_state||'')}</div></div>
      <div class="conf-section"><div class="conf-row">
        <span class="conf-label" style="color:${c}">${(report.confidence||'LOW').toUpperCase()}</span>
        <div class="conf-bar"><div class="conf-fill" style="width:${pct}%;background:${c}"></div></div>
        <span>${report.confidence==='high'?'数据高度一致':report.confidence==='medium'?'存在一定支持，仍有不确定性':'证据不足'}</span>
      </div></div>
    </div>
    <div class="section"><h2>📋 What Happened</h2><div class="section-body">${esc(report.what_happened)}</div></div>
    ${report.why?.length?`<div class="section"><h2>🔬 Why</h2><ul>${report.why.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`:''}
    ${strongHtml}${changedHtml}
    ${mattersHtml}${risksHtml}${anomalyHtml}
    ${report.data_caveats?.length?`<div class="section"><h2>📝 Data Caveats</h2><ul>${report.data_caveats.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`:''}
    <div class="section"><h2>⚙️ Tools Used (${report.used_tools?.length||0})</h2><div class="tool-tags">${tools||'<span class="tool-tag">没有成功调用 Tool</span>'}</div></div>
  </div></div>`;
  getMessages().appendChild(row);
  scrollToBottom(true);
}

// ── Auto-resize textarea ───────────────────
function autoResizeTa() {
  const ta = document.getElementById('q');
  if (!ta) return;
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
}

// ── SSE Consumer ───────────────────────────
// reject 出来的 Error 带 kind 字段：
//   'transport' — 流式通道本身没走通（HTTP 非 2xx / 连接被掐 / 一个事件都没收到）
//   'research'  — 后端明确报告调查失败（超时 / 上游模型 / 内部错误）
// 只有 transport 且「一个事件都没收到」时才值得退回同步接口重试：
// 那种情况通常是代理不支持 SSE。后端已经跑了三分钟的调查失败，
// 再同步重跑一遍只会让用户多等三分钟拿到同样的错误。
function runSSE(question, onProgress, resolve, reject, signal) {
  const url = '/api/ask/stream';
  const body = JSON.stringify({ question, conversation_id: currentConversationId });
  let started = false;

  const fail = (message, kind, retryableViaSync) => {
    const e = new Error(message);
    e.kind = kind;
    e.retryableViaSync = !!retryableViaSync;
    reject(e);
  };

  fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body, signal })
    .then(async (response) => {
      if (!response.ok) {
        const err = await response.json().catch(() => ({detail:'Request failed'}));
        fail(err.detail || `请求失败 (${response.status})`, 'transport', true);
        return;
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, {stream:true});
        const chunks = buffer.split('\n\n');
        buffer = chunks.pop() || '';
        for (const chunk of chunks) {
          const trimmed = chunk.trim();
          if (!trimmed) continue;
          const lines = trimmed.split('\n');
          let eventType = null, eventData = null;
          for (const line of lines) {
            if (line.startsWith('event: ')) eventType = line.slice(7).trim();
            if (line.startsWith('data: ')) eventData = line.slice(6).trim();
          }
          if (!eventType || !eventData) continue;
          try {
            const data = JSON.parse(eventData);
            if (eventType === 'progress') {
              onProgress(data);
              started = true;
            }
            if (eventType === 'result') {
              // Check if result contains an error (backend yielded error result)
              if (data && data.error) {
                fail(data.error, 'research', false);
                return;
              }
              if (!data || (!data.report && !data.what_happened)) {
                fail('后端返回了空结果', 'research', false);
                return;
              }
              // Strip trailing newline from loading indicator
              resolve(data);
              return;
            }
          } catch(e) { console.warn('SSE parse:', e); }
        }
      }
      // 流结束了却没收到 result 事件 —— 连接被中途掐断。
      // 以前这里 resolve(null)，调用方当成成功去渲染 null.report 直接抛
      // TypeError，用户看到 "Cannot read properties of null"。
      fail(started ? '连接中断，未收到调查结果' : '未收到任何数据（可能不支持流式）',
           'transport', !started);
    })
    .catch((err) => {
      if (err && err.name === 'AbortError') { reject(err); return; }
      if (err && err.kind) { reject(err); return; }   // 已经是 fail() 造好的
      fail((err && err.message) || '网络错误', 'transport', !started);
    });
}

// ── Main ask function ──────────────────────
let lastQuestion = null;

function retryLastQuestion() {
  if (!lastQuestion) return;
  const ta = document.getElementById('q');
  if (ta) ta.value = lastQuestion;
  ask();
}

async function askSync(q, signal) {
  const r = await fetch('/api/ask', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({question: q, conversation_id: currentConversationId}),
    signal,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || `请求失败 (${r.status})`);
  return data;
}

async function ask() {
  const ta = document.getElementById('q');
  const q = ta ? ta.value.trim() : '';
  if (!q) return;

  if (!currentConversationId) currentConversationId = crypto.randomUUID();
  lastQuestion = q;

  const btn = document.getElementById('askBtn');
  btn.disabled = true;

  // Add user bubble
  addUserBubble(q);
  ta.value = '';
  ta.style.height = 'auto';
  autoResizeTa();

  // Show loading
  addAILoader('正在调查…');

  // 客户端兜底时限 = 服务端预算 + 余量。真的到点了就 abort，
  // 而不是像以前那样只置一个标记、让 fetch 永远挂着。
  const controller = new AbortController();
  const limitS = serverBudgetS + CLIENT_TIMEOUT_MARGIN_S;
  lastErrorTimeout = setTimeout(() => controller.abort(), limitS * 1000);

  try {
    let resultData = null;
    try {
      await new Promise((resolve, reject) => {
        runSSE(q, updateProgress,
               (data) => { resultData = data; resolve(data); }, reject, controller.signal);
      });
    } catch(e) {
      if (e && e.name === 'AbortError') throw new Error(`调查超过 ${limitS}s，已中止`);
      if (e && e.kind === 'transport' && e.retryableViaSync) {
        // 流式通道压根没建立起来（多半是代理不支持 SSE）→ 退回同步接口
        resultData = await askSync(q, controller.signal);
      } else {
        // 后端已经明确报错了：重跑一遍只是让用户再等一个预算周期
        throw e;
      }
    }
    removeLoader();
    renderResult(resultData);
  } catch(e) {
    removeLoader();
    addErrorBubble(e.message || String(e), true);
  } finally {
    btn.disabled = false;
    clearTimeout(lastErrorTimeout);
    // Reset hint for follow-up
    const hint = document.getElementById('hint');
    if (hint) hint.textContent = '追问…（例如：那茅台呢？）';
  }
}

function renderResult(data) {
  if (!data) { addErrorBubble('后端返回了空结果', true); return; }
  const report = data.report || data;
  if (data.conversation_id) currentConversationId = data.conversation_id;
  addAIResponse(report);
}

// ── Events ──────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const ta = document.getElementById('q');
  if (ta) {
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
    });
    ta.addEventListener('input', autoResizeTa);
  }

  // 对齐客户端兜底时限与服务端研究预算；失败就沿用默认值，不阻塞 UI
  fetch('/health').then(r => r.json()).then(h => {
    if (h && Number.isFinite(h.research_budget_seconds)) {
      serverBudgetS = h.research_budget_seconds;
    }
  }).catch(() => {});
});
</script>

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-market-intelligence"
version = "0.1.0"
description = "Mosaic Market Intelligence Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.99",
    "mcp>=2,<3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "ddgs>=9.0",
    "akshare>=1.19",
    "langgraph>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

# T37: 本仓库是 flat-layout 多顶层目录（app 与 memory 都是顶层目录），
# setuptools 自动发现会因 "Multiple top-level packages" 直接拒绝构建，
# editable 与 wheel 安装都装不上。显式声明只打包 app*。
# memory/ 是简报 JSON 数据目录（memory/morning、memory/evening），不是包，不参与打包。
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["memory*", "tests*", "scripts*"]

# app/main.py 的 INDEX（GET / 的 FileResponse）在运行时读 app/web/index.html，
# 非 editable 安装（wheel）默认只带 .py，必须显式声明这个资源。
[tool.setuptools.package-data]
"app.web" = ["index.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
# 较新版本的 ruff formatter（本机 0.16.10 实测）会格式化 Markdown 里的 ```python
# 代码块；docs/ 里的嵌入代码是文档示例，不参与格式化门禁。
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

app = "mosaic-market-intelligence"
primary_region = "tyo"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  port = 8000
  type = "http"
  interval = "30s"
  timeout = "5s"
  path = "/health"

[env]
  PORT = "8000"
  HOST = "0.0.0.0"
